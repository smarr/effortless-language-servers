name: Tests

on:
  push:
  pull_request:
  # attach the extension to releases created on GitHub
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04 # ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SOMns support is currently disabled. We only need its debugger
      # protocol, which src/ links to, so skip SOMns' own submodules.
      - name: Checkout Submodules
        run: |
          git submodule update --init server/libs/SOMns
          git submodule update --init server/libs/TruffleSOM
          (cd server/libs/TruffleSOM && git submodule update --init)

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      # Node 24 matches VS Code 1.140, and the test tools need at least Node 22
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # TruffleSOM expects mx and graal next to it, i.e., in server/libs
      - name: Setup MX, LabsJDK, and Graal
        run: |
          cd server/libs/TruffleSOM
          ./som --setup mx
          echo "$(pwd)/../mx" >> "$GITHUB_PATH"
          export PATH=$PATH:$(pwd)/../mx
          source .github/ci.sh
          ensure_labsjdk_and_graal_version

      - name: NPM Install
        run: |
          npm install .

      - name: Server Unit Tests
        run: |
          (cd server && ant -e unit-test)

      - name: Integration Tests
        run: |
          sudo apt-get install xvfb
          xvfb-run --auto-servernum npm test

      - name: Package Extension
        run: |
          npm run package

      - name: Upload Extension for Release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

      # - name: CheckStyle
      #   run: |
      #     ant -e checkstyle

      # - name: Download Eclipse
      #   run: |
      #     export ECLIPSE_TAR=eclipse.tar.gz
      #     export ECLIPSE_URL=https://ftp.snt.utwente.nl/pub/software/eclipse/eclipse/downloads/drops4/R-4.19-202103031800/eclipse-SDK-4.19-linux-gtk-x86_64.tar.gz
      #     curl ${ECLIPSE_URL} -o ${ECLIPSE_TAR}
      #     tar -C ${GITHUB_WORKSPACE}/.. -xzf ${ECLIPSE_TAR}

      # - name: Check Eclipse Format
      #   run: |
      #     export ECLIPSE_EXE=${GITHUB_WORKSPACE}/../eclipse/eclipse
      #     ant -e eclipseformat

  # Attach the tested extension to a release, whose tag is for instance v0.9.0
  release:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in package.json"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Attach Extension to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
